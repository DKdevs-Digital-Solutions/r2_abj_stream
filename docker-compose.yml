version: "3.9"

services:
  r2-uploader:
    build: .
    container_name: r2-uploader
    ports:
      - "3008:3008"
    environment:
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET}
      PUBLIC_URL: ${PUBLIC_URL}
      PORT: 3008
      UPLOAD_TIMEOUT_MS: 600000
      REQUEST_TIMEOUT_MS: 610000
      MAX_FILE_SIZE_BYTES: 536870912
    restart: unless-stopped
